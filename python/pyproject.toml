[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talocode-messagelane"
version = "0.1.0"
description = "Python SDK for open-source consent-aware SMS campaigns, provider routing, and delivery operations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Talocode" }]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/talocode/messagelane"
Documentation = "https://docs.talocode.site"

[tool.hatch.build.targets.wheel]
packages = ["src/talocode_messagelane"]
